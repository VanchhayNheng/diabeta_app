name: diabeta_app
description: A modern diabetes management application with glassmorphism design
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^17.0.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Charts
  fl_chart: ^1.1.1
  
  # Date & Time
  intl: ^0.20.2
  
  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  
  # HTTP & API (for future)
  http: ^1.1.2
  dio: ^5.4.0
  
  # Utils
  uuid: ^4.3.3

  # Audio recording & playback
  flutter_sound: ^9.4.11
  audioplayers: ^5.2.1
  path_provider: ^2.1.1
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/nick_wilde.jpg
#    - assets/icons/
